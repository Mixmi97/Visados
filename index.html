<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.4' fill='%238a2b3d'/%3E%3Cpath d='M12 4.8 18.2 7.2 V12.7 C18.2 16.1 15.6 18.7 12 19.9 C8.4 18.7 5.8 16.1 5.8 12.7 V7.2 Z' fill='white'/%3E%3Cpath d='M9 12.2 L11.1 14.3 L15.2 9.7' fill='none' stroke='%238a2b3d' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visados — La Rioja</title>
    <script>
      /* Aplica el tema guardado (o el del sistema) antes del primer render para evitar parpadeo */
      (function () {
        try {
          var s = localStorage.getItem('visados:tema');
          var dark = s === 'dark' || (!s && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
